# Optional local infrastructure (alternative to the hosted services used during development).
#   docker compose up -d
# then use the "Local Docker" values from backend/.env.example.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reachinbox
      POSTGRES_PASSWORD: reachinbox
      POSTGRES_DB: reachinbox
    ports: ['5432:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    # AOF persistence so delayed jobs survive a Redis restart; never evict queue keys.
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec', '--maxmemory-policy', 'noeviction']
    ports: ['6379:6379']
    volumes: [redis-data:/data]

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ['9200:9200']
    volumes: [opensearch-data:/usr/share/opensearch/data]

volumes:
  postgres-data:
  redis-data:
  opensearch-data:
